<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f5af0">
        <animate attributeName="stop-color" values="#7f5af0;#2cb67d;#3da9fc;#7f5af0" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3da9fc">
        <animate attributeName="stop-color" values="#3da9fc;#7f5af0;#2cb67d;#3da9fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .blob { mix-blend-mode: screen; opacity: .55; }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 18s ease-in-out infinite alternate; }
    .b3 { animation: drift3 16s ease-in-out infinite alternate; }
    @keyframes drift1 { to { transform: translate(260px, 60px) scale(1.2); } }
    @keyframes drift2 { to { transform: translate(-240px, -40px) scale(.85); } }
    @keyframes drift3 { to { transform: translate(-120px, 70px) scale(1.15); } }

    .title {
      font: 800 78px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: 4px;
      fill: transparent;
      stroke: url(#text);
      stroke-width: 1.6;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: draw 2.6s ease forwards, fill 1s ease 2.2s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill { to { fill: url(#text); } }

    .sub {
      font: 500 20px 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      fill: #a7b1c2;
      opacity: 0;
      animation: rise .9s ease 2.6s forwards;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .cursor { fill: #2cb67d; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .1; } 50% { opacity: .8; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle class="blob b1" cx="180" cy="80" r="110" fill="#7f5af0"/>
      <circle class="blob b2" cx="820" cy="190" r="120" fill="#3da9fc"/>
      <circle class="blob b3" cx="560" cy="40" r="90" fill="#2cb67d"/>
    </g>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <circle class="star" cx="90"  cy="40"  r="1.5" style="animation-delay:.2s"/>
    <circle class="star" cx="260" cy="210" r="1.2" style="animation-delay:1.1s"/>
    <circle class="star" cx="430" cy="30"  r="1.4" style="animation-delay:2s"/>
    <circle class="star" cx="700" cy="60"  r="1.6" style="animation-delay:.7s"/>
    <circle class="star" cx="900" cy="35"  r="1.2" style="animation-delay:1.6s"/>
    <circle class="star" cx="950" cy="220" r="1.5" style="animation-delay:2.4s"/>
    <circle class="star" cx="60"  cy="200" r="1.3" style="animation-delay:1.3s"/>

    <text class="title" x="500" y="140" text-anchor="middle">namadeku</text>
    <text class="sub" x="500" y="190" text-anchor="middle">~/dev $ building things with python &amp; typescript<tspan class="cursor"> ▌</tspan></text>

    <rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
